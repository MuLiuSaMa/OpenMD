[package]
name = "OpenMD-installer"
version = "10.0.0"
description = "OpenMD Installer"
authors = ["MuLiu"]
edition = "2021"

[lib]
name = "openmd_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
dirs = "5"
zip = "2"
mslnk = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell"] }

# MSVC link.exe 的本地化提示（如"正在创建库..."）会被透传为警告，这里关闭
[lints.rust]
linker_messages = "allow"
